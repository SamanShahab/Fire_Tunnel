# FireTunnel OpenVPN server (runs inside ft-firewall). Paths are absolute (bind mount /opt/lab/vpn).
port 1194
proto udp
dev tun0
dev-type tun
topology subnet
server 10.40.0.0 255.255.255.0

ca   /opt/lab/vpn/server/pki/ca.crt
cert /opt/lab/vpn/server/pki/issued/server.crt
key  /opt/lab/vpn/server/pki/private/server.key
dh none
tls-crypt /opt/lab/vpn/server/tc.key
crl-verify /opt/lab/vpn/server/pki/crl.pem

# Crypto
tls-version-min 1.2
cipher AES-256-GCM
data-ciphers AES-256-GCM:AES-128-GCM:CHACHA20-POLY1305
auth SHA256

# Authentication = client certificate AND username/password (username must equal cert CN)
verify-client-cert require
script-security 2
auth-user-pass-verify /opt/lab/vpn/server/verify.sh via-file

# Authorization: fixed tunnel IP per profile so the firewall can enforce per-user policy
client-config-dir /opt/lab/vpn/server/ccd
ccd-exclusive

# Only the Trusted/Internal network is routed through the tunnel
push "route 10.10.0.0 255.255.255.0"

keepalive 10 60
persist-key
persist-tun
status /opt/lab/vpn/server/openvpn-status.log 5
verb 3
